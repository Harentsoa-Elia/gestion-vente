# Site Nginx de guichetweb.
# Copier dans /etc/nginx/sites-available/guichetweb, remplacer VOTRE_DOMAINE (2 fois),
# puis activer :  sudo ln -s /etc/nginx/sites-available/guichetweb /etc/nginx/sites-enabled/
# Le HTTPS est ajouté ensuite automatiquement par certbot (étape 9 du guide).

server {
    listen 80;
    listen [::]:80;
    server_name VOTRE_DOMAINE;

    # affiches et photos de profil (jusqu'à 8 Mo côté API)
    client_max_body_size 10M;

    # API : routes, documentation Swagger, fichiers envoyés
    location /api/ {
        proxy_pass http://127.0.0.1:8888;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /media/ {
        proxy_pass http://127.0.0.1:8888;
        proxy_set_header Host $host;
    }
    location ~ ^/(docs|openapi.json) {
        proxy_pass http://127.0.0.1:8888;
        proxy_set_header Host $host;
    }

    # tout le reste : le site Next.js
    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
